<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>搭子圈 MateCircle 预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #dfe6e3; color: #333; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    body, .frame, .frame * { cursor: none !important; }
    .frame { width: min(390px, calc(100vw - 48px)); height: min(844px, calc(100vh - 48px)); background: #F5F7F9; border: 10px solid #111; border-radius: 34px; overflow: hidden; position: relative; box-shadow: 0 20px 80px rgba(31,54,47,.22); }
    .status { height: 34px; background: #4A7B6B; color: #fff; padding: 8px 20px 0; font-size: 12px; display: flex; justify-content: space-between; }
    .nav { height: 46px; background: #4A7B6B; color: #fff; display: flex; align-items: center; justify-content: center; position: relative; font-weight: 700; }
    .back { position: absolute; left: 14px; border: 0; background: transparent; color: #fff; font-size: 24px; display: none; }
    .screen { height: calc(100% - 80px); overflow-y: auto; padding: 18px; padding-bottom: 86px; }
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 68px; background: #fff; display: flex; border-top: 1px solid #eee; }
    .tab { flex: 1; border: 0; background: #fff; color: #666; font-size: 12px; }
    .tab .ico { display: block; font-size: 20px; margin-bottom: 3px; }
    .tab.active { color: #4A7B6B; font-weight: 700; }
    .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
    .logo { width: 76px; height: 76px; border-radius: 18px; background: #4A7B6B; margin: 54px auto 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; font-weight: 800; }
    h1, p { margin: 0; }
    h1 { text-align: center; color: #2F5549; font-size: 25px; }
    .hint { margin-top: 6px; color: #7B8783; text-align: center; font-size: 13px; }
    .title { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
    input, textarea { width: 100%; border: 1px solid #eee; border-radius: 8px; background: #fff; padding: 12px; margin-bottom: 12px; font-size: 14px; outline: none; }
    textarea { min-height: 90px; resize: none; }
    .row { display: flex; align-items: center; gap: 10px; }
    .space { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .btn { width: 100%; height: 46px; border-radius: 23px; border: 0; background: #F5A623; color: #fff; font-weight: 800; font-size: 15px; margin-top: 6px; }
    .btn.secondary { background: #fff; color: #4A7B6B; border: 1px solid #4A7B6B; }
    .btn.danger { background: #D64545; }
    .btn.small { width: auto; min-width: 84px; height: 36px; font-size: 13px; margin: 0; padding: 0 12px; }
    .btn:disabled { background: #ccc; color: #fff; }
    .agreement { font-size: 12px; color: #666; margin: 4px 0 14px; }
    .link { color: #4A7B6B; }
    .search { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 22px; padding: 0 14px; margin-bottom: 14px; box-shadow: 0 1px 8px rgba(0,0,0,.05); }
    .search input { border: 0; margin: 0; padding: 12px 0; }
    .chips, .actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .chips { margin-bottom: 14px; }
    .chip { white-space: nowrap; border: 0; padding: 8px 15px; border-radius: 17px; background: #fff; color: #666; }
    .chip.active { background: #4A7B6B; color: #fff; }
    .label-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .label { border: 0; padding: 9px 15px; border-radius: 18px; background: #F3F5F4; color: #555; }
    .label.active { background: #4A7B6B; color: #fff; }
    .cover, .banner { background: linear-gradient(135deg, #9CC8BA, #F5A623); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; }
    .cover img, .banner img { width: 100%; height: 100%; object-fit: cover; }
    .cover { height: 164px; border-radius: 10px 10px 0 0; font-size: 28px; }
    .banner { height: 220px; margin: -18px -18px 14px; font-size: 30px; }
    .activity { padding: 0; overflow: hidden; }
    .activity-body { padding: 16px; }
    .activity-title { font-size: 18px; font-weight: 800; max-width: 238px; }
    .badge { border-radius: 13px; background: #EEF5F2; color: #4A7B6B; padding: 4px 9px; font-size: 12px; white-space: nowrap; }
    .meta, .muted { color: #666; font-size: 13px; }
    .meta { margin-top: 7px; }
    .price { color: #F5A623; font-weight: 900; }
    .quota { display: flex; gap: 10px; margin-top: 14px; }
    .quota div { flex: 1; background: #F5F7F9; border-radius: 8px; padding: 12px; }
    .quota strong { display: block; color: #4A7B6B; font-size: 22px; margin-top: 4px; }
    .gallery-card { padding-left: 0; padding-right: 0; overflow: hidden; }
    .gallery-card .title { padding: 0 18px; }
    .gallery { display: flex; flex-direction: column; gap: 12px; }
    .gallery img, .gallery .ph { width: 100%; height: 260px; object-fit: cover; border-radius: 0; background: linear-gradient(135deg, #9CC8BA, #F5A623); display: block; box-shadow: none; }
    .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .upload-item { position: relative; border-radius: 8px; overflow: hidden; background: #F5F7F9; }
    .upload-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
    .remove-image { position: absolute; right: 5px; top: 5px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: rgba(0,0,0,.58); color: #fff; font-size: 16px; line-height: 22px; }
    .bottom { position: sticky; bottom: -86px; background: #fff; margin: 16px -18px -86px; padding: 12px 18px; box-shadow: 0 -2px 10px rgba(0,0,0,.06); }
    .amount { display: block; text-align: center; color: #F5A623; font-weight: 900; font-size: 42px; margin: 12px 0; }
    .profile { display: flex; gap: 14px; align-items: center; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: #4A7B6B; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; }
    .menu div { padding: 15px 0; border-bottom: 1px solid #eee; }
    .menu div:last-child { border-bottom: 0; }
    .screen.chat-screen { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 18px; }
    .messages { min-height: 450px; }
    .chat-screen .messages { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 12px; }
    .msg { margin: 12px 0; }
    .msg.mine { text-align: right; }
    .sender { display: block; color: #999; font-size: 11px; margin-bottom: 4px; }
    .bubble { display: inline-block; max-width: 260px; padding: 10px 12px; border-radius: 10px; background: #fff; text-align: left; }
    .mine .bubble { background: #4A7B6B; color: #fff; }
    .composer { position: sticky; bottom: -86px; background: #fff; display: flex; gap: 8px; padding: 10px 0; margin-bottom: -86px; }
    .chat-screen .composer { position: static; margin: 0 -18px -18px; padding: 10px 18px 18px; border-top: 1px solid #eee; box-shadow: 0 -2px 10px rgba(0,0,0,.05); }
    .composer input { margin: 0; }
    .toast { position: absolute; left: 50%; top: 116px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 9px 14px; border-radius: 18px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 10; }
    .toast.show { opacity: 1; }
    @media (max-width: 768px) {
      html, body { width: 100%; overflow: hidden; background: #F5F7F9; }
      body { padding: 0; display: block; }
      .frame { width: 100vw; height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
      .activity-title { max-width: 58vw; }
      .screen { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="status"><span>15:55</span><span>5G 100%</span></div>
    <div class="nav"><button class="back" id="back">‹</button><span id="navTitle">搭子圈</span></div>
    <div class="toast" id="toast"></div>
    <section class="screen" id="screen"></section>
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="home"><span class="ico">◉</span>活动</button>
      <button class="tab" data-tab="mine"><span class="ico">●</span>我的</button>
    </nav>
  </main>
  <script>
    const state = {
      user: null,
      page: 'login',
      tab: 'home',
      history: [],
      labels: [],
      category: '全部',
      keyword: '',
      currentActivity: 'a1',
      editingId: '',
      orders: [],
      applications: [],
      messages: [{ sender: '主理人', text: '欢迎进群，活动前一天会确认集合点。' }],
      activities: [
        { id: 'a1', title: '周末咖啡桌游局', category: '桌游', price: 99, address: '上海市徐汇区衡山路 88 号', time: '2026-06-13 14:00', signNum: 2, newUserNum: 0, paid: false, cover: '', images: ['', '', ''], content: '4 人小局，适合想认识新朋友但不想太吵的周末下午。费用含饮品和场地。' },
        { id: 'a2', title: '城市夜跑搭子组', category: '运动', price: 39, address: '上海市浦东新区滨江步道', time: '2026-06-15 19:30', signNum: 1, newUserNum: 0, paid: false, cover: '', images: ['', ''], content: '配速 6-7 分钟，轻松社交跑。集合后热身、慢跑 5 公里，结束后可一起补水聊天。' }
      ]
    };
    const screen = document.getElementById('screen');
    const navTitle = document.getElementById('navTitle');
    const tabbar = document.getElementById('tabbar');
    const back = document.getElementById('back');
    const titles = { login: '登录', realname: '实名认证', labels: '兴趣标签', home: '活动', detail: '活动详情', pay: '确认支付', chat: '活动群聊', mine: '我的', orders: '我的订单', manager: '主理人工作台', publish: '发布活动' };
    function toast(text) { const el = document.getElementById('toast'); el.textContent = text; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1500); }
    function go(page, push = true) { if (push && state.page !== page) state.history.push(state.page); state.page = page; render(); }
    function replace(page) { state.page = page; render(); }
    function activity() { return state.activities.find(item => item.id === state.currentActivity) || state.activities[0]; }
    function render() {
      navTitle.textContent = titles[state.page] || '搭子圈';
      back.style.display = state.history.length ? 'block' : 'none';
      tabbar.style.display = ['home', 'mine'].includes(state.page) ? 'flex' : 'none';
      screen.classList.toggle('chat-screen', state.page === 'chat');
      document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === state.tab));
      ({ login: renderLogin, realname: renderRealname, labels: renderLabels, home: renderHome, detail: renderDetail, pay: renderPay, chat: renderChat, mine: renderMine, orders: renderOrders, manager: renderManager, publish: renderPublish }[state.page] || renderHome)();
    }
    function renderLogin() {
      screen.innerHTML = `<div class="logo">搭</div><h1>搭子圈</h1><p class="hint">验证码 123456 可直接体验 MVP 流程</p><div class="card" style="margin-top:36px"><div class="title">手机号登录</div><input id="phone" value="13800000000" placeholder="请输入手机号"><input id="code" value="123456" placeholder="请输入验证码"><div class="agreement"><input type="checkbox" checked style="width:auto;margin:0 6px 0 0">我已阅读并同意 <span class="link">《用户协议》</span> 和 <span class="link">《隐私政策》</span></div><button class="btn" id="loginBtn">登录</button><button class="btn secondary" id="quickBtn">微信快捷体验</button></div>`;
      document.getElementById('loginBtn').onclick = login;
      document.getElementById('quickBtn').onclick = login;
    }
    function login() {
      const phone = document.getElementById('phone').value;
      const accounts = {
        '13900000001': { name: '公司审核测试号', real: false, labels: [], count: 0, role: 'company', managerStatus: 'approved' },
        '13900000002': { name: '主理人测试号', real: false, labels: [], count: 0, role: 'manager', managerStatus: 'approved' },
        '13900000003': { name: '普通用户测试号', real: false, labels: [], count: 0, role: 'user', managerStatus: 'none' }
      };
      state.user = accounts[phone] || { name: '体验用户', real: false, labels: [], count: 0, role: 'user', managerStatus: 'none' };
      toast('登录成功');
      if (!state.user.real) go('realname');
      else if (!state.user.labels.length) go('labels');
      else { state.tab = 'home'; state.history = []; go('home', false); }
    }
    function renderRealname() {
      screen.innerHTML = `<div class="card"><div class="title">实名认证</div><p class="muted">MVP 中模拟认证，上线前接入真实能力。</p></div><div class="card"><input value="张三" placeholder="真实姓名"><input value="310101199001011234" placeholder="身份证号"><button class="btn" id="submitReal">完成认证</button></div>`;
      document.getElementById('submitReal').onclick = () => { state.user.real = true; toast('认证完成'); go('labels'); };
    }
    function renderLabels() {
      const all = ['咖啡','桌游','徒步','夜跑','羽毛球','电影','展览','读书','摄影','露营','美食','剧本杀'];
      screen.innerHTML = `<div class="card"><div class="title">选择兴趣标签</div><p class="muted">最多选择 5 个，用来推荐更合适的同城活动。</p><div class="label-grid">${all.map(x => `<button class="label ${state.labels.includes(x) ? 'active' : ''}" data-label="${x}">${x}</button>`).join('')}</div><button class="btn" id="enterBtn">进入搭子圈</button></div>`;
      document.querySelectorAll('.label').forEach(btn => btn.onclick = () => { const v = btn.dataset.label; state.labels = state.labels.includes(v) ? state.labels.filter(x => x !== v) : [...state.labels, v].slice(0, 5); renderLabels(); });
      document.getElementById('enterBtn').onclick = () => { state.user.labels = state.labels; state.tab = 'home'; state.history = []; go('home', false); };
    }
    function filteredActivities() {
      return state.activities.filter(item => (state.category === '全部' || item.category === state.category) && (!state.keyword || item.title.includes(state.keyword) || item.address.includes(state.keyword)));
    }
    function renderHome() {
      const cats = ['全部','咖啡','桌游','运动','展览','读书'];
      screen.innerHTML = `<div class="search"><span>⌕</span><input id="kw" value="${state.keyword}" placeholder="搜索活动"></div><div class="chips">${cats.map(c => `<button class="chip ${state.category === c ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('')}</div>${filteredActivities().map(item => `<div class="card activity" data-id="${item.id}"><div class="cover">${item.cover ? `<img src="${item.cover}">` : 'MateCircle'}</div><div class="activity-body"><div class="space"><span class="activity-title">${item.title}</span><span class="badge">${item.category}</span></div><div class="meta">${item.time}</div><div class="meta">${item.address}</div><div class="space" style="margin-top:12px"><span class="price">¥${item.price.toFixed(2)}</span><span class="muted">${item.paid ? '已缴费' : `已报 ${item.signNum}/4`}</span></div></div></div>`).join('') || '<div class="empty">暂无活动</div>'}`;
      document.getElementById('kw').oninput = e => { state.keyword = e.target.value; renderHome(); };
      document.querySelectorAll('.chip').forEach(btn => btn.onclick = () => { state.category = btn.dataset.cat; renderHome(); });
      document.querySelectorAll('.activity').forEach(card => card.onclick = () => { state.currentActivity = card.dataset.id; go('detail'); });
    }
    function renderDetail() {
      const item = activity();
      const oldRemain = Math.max(0, 3 - (item.signNum - item.newUserNum));
      const newRemain = Math.max(0, 1 - item.newUserNum);
      const images = (item.images && item.images.length ? item.images : [item.cover]).filter(x => x !== undefined);
      screen.innerHTML = `<div class="banner">${images[0] ? `<img src="${images[0]}">` : 'MateCircle'}</div><div class="card"><div class="space"><span class="activity-title">${item.title}</span><span class="price">¥${item.price.toFixed(2)}/人</span></div><div class="meta">${item.time} - ${item.time.slice(0,10)} 17:00</div><div class="meta">${item.address}</div><div class="quota"><div><span class="muted">老用户名额</span><strong>${oldRemain}/3</strong></div><div><span class="muted">新人名额</span><strong>${newRemain}/1</strong></div></div></div><div class="card"><div class="title">活动介绍</div><p>${item.content}</p></div><div class="card"><div class="title">已报名</div><p class="muted">已有 ${item.signNum} 位搭子报名</p></div><div class="card gallery-card"><div class="title">主理人上传图片</div><div class="gallery">${images.map(img => img ? `<img src="${img}">` : '<div class="ph"></div>').join('')}</div></div><div class="bottom row"><button class="btn secondary small" id="chatBtn">群聊</button><button class="btn" id="signupBtn">${item.paid ? '已缴费' : item.signNum >= 4 ? '名额已满' : '立即报名'}</button></div>`;
      document.getElementById('chatBtn').onclick = () => item.paid ? go('chat') : toast('缴费后可进入群聊');
      document.getElementById('signupBtn').onclick = () => item.paid ? go('chat') : go('pay');
    }
    function renderPay() {
      const item = activity();
      screen.innerHTML = `<div class="card" style="text-align:center;padding:42px 18px"><span class="muted">应付金额</span><span class="amount">¥${item.price.toFixed(2)}</span><span class="muted">订单号：ORDER_PREVIEW_001</span></div><button class="btn" id="payBtn">确认支付</button><button class="btn secondary" id="laterBtn">稍后支付</button>`;
      document.getElementById('payBtn').onclick = () => { if (!item.paid) { item.signNum += 1; item.paid = true; state.user.count += 1; state.orders.unshift({ id: `o${Date.now()}`, activityId: item.id, title: item.title, price: item.price, status: '已缴费' }); state.messages.push({ sender: '我', text: '大家好，我报名成功啦。', mine: true }); } toast('模拟支付成功'); replace('chat'); };
      document.getElementById('laterBtn').onclick = () => replace('detail');
    }
    function renderChat() {
      screen.innerHTML = `<div class="messages">${state.messages.map(m => `<div class="msg ${m.mine ? 'mine' : ''}"><span class="sender">${m.sender}</span><span class="bubble">${m.text}</span></div>`).join('')}</div><div class="composer"><input id="msgInput" placeholder="说点什么"><button class="btn small" id="sendBtn">发送</button></div>`;
      document.getElementById('sendBtn').onclick = sendMessage;
      document.getElementById('msgInput').onkeydown = e => { if (e.key === 'Enter') sendMessage(); };
    }
    function sendMessage() { const input = document.getElementById('msgInput'); const text = input.value.trim(); if (!text) return; state.messages.push({ sender: '我', text, mine: true }); input.value = ''; renderChat(); }
    function renderMine() {
      const user = state.user || { name: '未登录用户', real: false, count: 0 };
      screen.innerHTML = `<div class="card profile"><div class="avatar">搭</div><div><div class="title" style="margin-bottom:4px">${user.name}</div><div class="muted">${user.real ? '已认证' : '未认证'} · ${user.role === 'company' ? '公司审核' : user.managerStatus === 'approved' ? '主理人' : '普通用户'} · 已参加 ${user.count || 0} 场</div></div></div><div class="card menu"><div id="ordersBtn">我的订单</div><div onclick="go('realname')">实名认证</div><div onclick="go('labels')">兴趣标签</div><div id="managerBtn">主理人工作台</div><div id="companyBtn">切换公司审核账号</div><div id="logout">设置 / 退出登录</div></div>`;
      document.getElementById('ordersBtn').onclick = () => go('orders');
      document.getElementById('managerBtn').onclick = () => go('manager');
      document.getElementById('companyBtn').onclick = () => { state.user.role = 'company'; state.user.managerStatus = 'approved'; toast('已切换为公司审核权限'); renderMine(); };
      document.getElementById('logout').onclick = () => { state.user = null; state.history = []; toast('已退出'); go('login', false); };
    }
    function renderOrders() {
      screen.innerHTML = `${state.orders.length ? state.orders.map(order => `<div class="card" data-order="${order.activityId}"><div class="space"><span class="activity-title">${order.title}</span><span class="badge">${order.status}</span></div><div class="meta">点击查看已报名活动详情</div><div class="price" style="margin-top:10px">¥${order.price.toFixed(2)}</div></div>`).join('') : '<div class="empty">暂无订单，报名缴费后会出现在这里</div>'}`;
      document.querySelectorAll('[data-order]').forEach(card => card.onclick = () => { state.currentActivity = card.dataset.order; go('detail'); });
    }
    function renderManager() {
      if (state.user.role === 'company') {
        screen.innerHTML = `<div class="card"><div class="title">公司审核后台</div><p class="muted">审核主理人申请，通过后用户获得主理人权限。</p></div>${state.applications.length ? state.applications.map(app => `<div class="card"><div class="space"><span class="activity-title">${app.name}</span><span class="badge">${app.status}</span></div><div class="meta">${app.reason}</div>${app.status === '待审核' ? `<div class="actions" style="margin-top:14px"><button class="btn small secondary" data-approve="${app.id}">通过</button><button class="btn small danger" data-reject="${app.id}">拒绝</button></div>` : ''}</div>`).join('') : '<div class="empty">暂无待审核申请</div>'}`;
        document.querySelectorAll('[data-approve]').forEach(btn => btn.onclick = () => { const app = state.applications.find(x => x.id === btn.dataset.approve); app.status = '已通过'; state.user.role = 'manager'; state.user.managerStatus = 'approved'; toast('已通过'); renderManager(); });
        document.querySelectorAll('[data-reject]').forEach(btn => btn.onclick = () => { state.applications.find(x => x.id === btn.dataset.reject).status = '未通过'; toast('已拒绝'); renderManager(); });
        return;
      }
      if (state.user.managerStatus !== 'approved') {
        const pending = state.user.managerStatus === 'pending';
        screen.innerHTML = `<div class="card"><div class="title">${pending ? '申请审核中' : '申请成为主理人'}</div><p class="muted">${pending ? '公司正在审核，通过后开放工作台。' : '普通用户只能申请主理人，审核通过后才能发布和管理活动。'}</p></div>${pending ? '' : `<div class="card"><textarea id="applyReason" placeholder="申请理由"></textarea><textarea id="applyExp" placeholder="活动组织经验"></textarea><button class="btn" id="applyBtn">提交申请</button></div>`}`;
        if (!pending) document.getElementById('applyBtn').onclick = () => { state.user.managerStatus = 'pending'; state.applications.unshift({ id: `apply${Date.now()}`, name: state.user.name, reason: applyReason.value || '希望组织高质量同城活动', status: '待审核' }); toast('已提交申请'); renderManager(); };
        return;
      }
      screen.innerHTML = `<div class="card"><div class="title">主理人工作台</div><p class="muted">管理活动的新增、编辑、删除和查看。</p></div><button class="btn" id="addActivity">新增活动</button><div class="title" style="margin-top:22px">活动管理</div>${state.activities.map(item => `<div class="card"><div class="space"><span class="activity-title">${item.title}</span><span class="badge">已报 ${item.signNum}/4</span></div><div class="meta">${item.time}</div><div class="meta">${item.address}</div><div class="actions" style="margin-top:14px"><button class="btn small secondary" data-view="${item.id}">查看</button><button class="btn small" data-edit="${item.id}">编辑</button><button class="btn small danger" data-delete="${item.id}">删除</button></div></div>`).join('')}`;
      document.getElementById('addActivity').onclick = () => { state.editingId = ''; go('publish'); };
      document.querySelectorAll('[data-view]').forEach(btn => btn.onclick = () => { state.currentActivity = btn.dataset.view; go('detail'); });
      document.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => { state.editingId = btn.dataset.edit; go('publish'); });
      document.querySelectorAll('[data-delete]').forEach(btn => btn.onclick = () => { state.activities = state.activities.filter(item => item.id !== btn.dataset.delete); toast('已删除'); renderManager(); });
    }
    function renderPublish() {
      const item = state.editingId ? state.activities.find(x => x.id === state.editingId) : { title: '', category: '', price: '', address: '', time: '', content: '', cover: '', images: [] };
      screen.innerHTML = `<div class="card"><div class="title">${state.editingId ? '编辑活动' : '新增活动'}</div><input id="fTitle" placeholder="活动名称" value="${item.title || ''}"><input id="fCategory" placeholder="分类，如咖啡、桌游、运动" value="${item.category || ''}"><input id="fPrice" type="number" placeholder="价格（元）" value="${item.price || ''}"><input id="fAddress" placeholder="详细地址" value="${item.address || ''}"><input id="fTime" placeholder="活动时间，如 2026-06-20 14:00" value="${item.time || ''}"><textarea id="fContent" placeholder="活动介绍">${item.content || ''}</textarea><div class="title">上传封面图片</div><input id="fCover" type="file" accept="image/*"><div id="coverBox" class="upload-grid">${item.cover ? `<img src="${item.cover}">` : ''}</div><div class="title">上传详情图片（最多 9 张）</div><input id="fImages" type="file" accept="image/*" multiple><div id="imageBox" class="upload-grid">${(item.images || []).map(img => img ? `<img src="${img}">` : '<div class="ph"></div>').join('')}</div><button class="btn" id="saveActivity">${state.editingId ? '保存更改' : '发布活动'}</button></div>`;
      let cover = item.cover || '';
      let images = [...(item.images || [])];
      function renderUploadPreview() {
        coverBox.innerHTML = cover ? `<div class="upload-item"><img src="${cover}"><button class="remove-image" id="removeCover" type="button">×</button></div>` : '';
        imageBox.innerHTML = images.map((img, index) => img ? `<div class="upload-item"><img src="${img}"><button class="remove-image" data-remove-image="${index}" type="button">×</button></div>` : '').join('');
        const removeCover = document.getElementById('removeCover');
        if (removeCover) removeCover.onclick = () => { cover = ''; renderUploadPreview(); };
        document.querySelectorAll('[data-remove-image]').forEach(btn => btn.onclick = () => {
          images.splice(Number(btn.dataset.removeImage), 1);
          renderUploadPreview();
        });
      }
      fCover.onchange = e => { const file = e.target.files[0]; if (!file) return; cover = URL.createObjectURL(file); renderUploadPreview(); };
      fImages.onchange = e => {
        images = [...images, ...Array.from(e.target.files).map(file => URL.createObjectURL(file))].filter(Boolean).slice(0, 9);
        renderUploadPreview();
      };
      renderUploadPreview();
      document.getElementById('saveActivity').onclick = () => {
        const data = { title: fTitle.value, category: fCategory.value || '活动', price: Number(fPrice.value || 0), address: fAddress.value, time: fTime.value, content: fContent.value, cover: cover || images[0] || '', images: images.length ? images : [cover || ''] };
        if (!data.title || !data.price || !data.address || !data.time || !data.content) return toast('请填写完整信息');
        if (state.editingId) Object.assign(state.activities.find(x => x.id === state.editingId), data);
        else state.activities.unshift({ id: `a${Date.now()}`, signNum: 0, newUserNum: 0, paid: false, ...data });
        toast(state.editingId ? '已保存' : '发布成功');
        replace('manager');
      };
    }
    back.onclick = () => {
      if (state.page === 'chat') return replace('detail');
      const previous = state.history.pop();
      if (previous) replace(previous);
    };
    document.querySelectorAll('.tab').forEach(btn => btn.onclick = () => { state.tab = btn.dataset.tab; state.history = []; go(state.tab === 'home' ? 'home' : 'mine', false); });
    render();
  </script>
</body>
</html>
